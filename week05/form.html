<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Assignment</title>
    <meta name="description" content="This page has a form with a best practices design">
    <meta name="author" content="Samuel Amorim Maciel">

    <!--external files-->
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-mobile.css">
    <script src="scripts/form.js" defer></script>

    <!--fonts api google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <label for="product-name">Product Name
                <select name="product-name" id="product-name" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>
            </label>

            <label>Overall Rating <br>
                <div>
                    <p>&star;</p>
                    <input type="radio" name="rating" id="1star" required>
                </div>
                <div>
                    <p>&star;&star;</p>
                    <input type="radio" name="rating" id="2star" required>
                </div>
                <div>
                    <p>&star;&star;&star;</p>
                    <input type="radio" name="rating" id="3star" required>
                </div>
                <div>
                    <p>&star;&star;&star;&star;</p>
                    <input type="radio" name="rating" id="4star" required>
                </div>
                <div>
                    <p>&star;&star;&star;&star;&star;</p>
                    <input type="radio" name="rating" id="5star" required>
                </div>
            </label>

            <label>Date of Installation
                <input type="date" id="date" name="date" required>
            </label>

            <label>Which features did you find useful in the product?<br>(Check all that apply)<br>
                <input type="checkbox" id="design" name="design" value="design"> Design <br>
                <input type="checkbox" id="durability" name="durability" value="durability"> Durability<br>
                <input type="checkbox" id="ease" name="ease" value="ease"> Ease of Use<br>
                <input type="checkbox" id="performance" name="performance" value="performance"> Performance
            </label>

            <label>Written Review (Optional)
                <textarea name="review" id="review"></textarea>
            </label>

            <label>Your Name (Optional)
                <input type="text" name="name" id="name">
            </label>

            <input type="submit" value="Post Review" id="submit">
        </form>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> ⚽ Samuel Maciel ⚽ Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
